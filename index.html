<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="MVIMG_20260715_105738.jpg">
    <title>SuthepW13 Cactus</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f3f7f3; text-align: center; padding: 20px; }
        .header { display: flex; justify-content: center; align-items: center; gap: 15px; color: #2e7d32; margin-bottom: 30px; }
        .header-icon { height: 40px; border-radius: 50%; }
        h1 { margin: 0; font-size: 2em; }
        
        .container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1000px; margin: 0 auto 40px auto; }
        
        /* ปรับปรุงตรงนี้: ให้ทุกการ์ด (รวมทั้งหนังสือ) มีพื้นหลังสีเหลืองครีมอ่อนเหมือนกันทั้งหมด เพื่อความเป็นระเบียบ */
        .card { background: #fff8e1; padding: 15px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
        
        .card-img-top { width: 100%; height: 200px; object-fit: contain; border-radius: 10px; margin-bottom: 10px; }
        .card-img-book { width: 100%; height: 300px; object-fit: contain; margin-bottom: 10px; } 
        
        /* สไตล์ตัวหนังสือสีแดง ตัวหนา (เท่ากันและเหมือนกันทั้ง Xiaomi และรูปในอดีต) */
        .photo-count { color: #d32f2f; font-size: 0.95em; font-weight: bold; margin: 5px 0; }
        h3 { margin: 10px 0 5px 0; }
        
        .btn { display: inline-block; padding: 10px 20px; background: #2e7d32; color: white; text-decoration: none; border-radius: 20px; margin-top: 15px; font-size: 0.9em; width: fit-content; }
        
        .books-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1000px; margin: 0 auto; }
    </style>
</head>
<body>

<div class="header">
    <img src="MVIMG_20260715_105738.jpg" class="header-icon">
    <h1>SuthepW13 Cactus Collection</h1>
    <img src="MVIMG_20260715_105738.jpg" class="header-icon">
</div>

<div class="container">
    <div class="card">
        <img src="20260702_194152_2301.jpg" class="card-img-top">
        <h3>Cactus Gallery</h3>
        <p class="photo-count">📸 by Xiaomi 17 Ultra</p>
        <a href="xiaomi-gallery.html" class="btn">Enter Gallery →</a>
    </div>
    <div class="card">
        <img src="20260702_194059_9605.jpg" class="card-img-top">
        <h3>Cactus Gallery</h3>
        <p class="photo-count">🌸 ภาพดอกแคคตัสในอดีต 503 รูป</p>
        <a href="gallery.html" class="btn">Enter Gallery →</a>
    </div>
    <div class="card">
        <img src="MVIMG_20260715_105738.jpg" class="card-img-top">
        <h3>ปฏิทินแคคตัส</h3>
        <a href="calendar.html" class="btn">เปิดปฏิทิน →</a>
    </div>
</div>

<hr>
<h2>Books Collection</h2>

<div class="books-section">
    <div class="card">
        <img src="https://online.anyflip.com/zzhpt/ipox/files/shot.jpg" class="card-img-book">
        <h3>Collection เล่มที่ 1</h3>
        <a href="https://anyflip.com/zzhpt/ipox/" class="btn">เปิดหนังสือ</a>
    </div>
    <div class="card">
        <img src="https://online.anyflip.com/zzhpt/ecll/files/shot.jpg" class="card-img-book">
        <h3>Collection เล่มที่ 2</h3>
        <a href="https://anyflip.com/zzhpt/ecll/" class="btn">เปิดหนังสือ</a>
    </div>
    <div class="card">
        <img src="https://online.anyflip.com/zzhpt/rzrq/files/shot.jpg" class="card-img-book">
        <h3>Collection เล่มที่ 3</h3>
        <a href="https://anyflip.com/zzhpt/rzrq/" class="btn">เปิดหนังสือ</a>
    </div>
</div>

</body>
</html>

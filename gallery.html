    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .gallery-item { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
        .gallery-item:hover { transform: translateY(-5px); }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; display: block; }
        .gallery-info { padding: 10px; text-align: center; font-size: 14px; color: #555; }
        /* Lightbox Modal */
        #lightbox { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; flex-direction: column; color: #fff; }
        #lightbox img { max-width: 80%; max-height: 70vh; border-radius: 5px; }
        #lightbox .desc { margin-top: 15px; font-size: 16px; text-align: center; max-width: 800px; padding: 0 20px; }
        #lightbox span { position: absolute; top: 20px; right: 30px; font-size: 35px; cursor: pointer; }
    </style>

        // สร้าง Grid รูปภาพ 1-100 พร้อมระบบ Lazy Loading
        const grid = document.getElementById('galleryGrid');
        for (let i = 1; i <= 100; i++) {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.onclick = () => openLightbox(`cactus (${i}).jpg`, cactusNames[i] || `Cactus ${i}`, cactusDesc[i] || '');
            
            const img = document.createElement('img');
            img.src = `cactus (${i}).jpg`;
            img.alt = `Cactus ${i}`;
            img.loading = 'lazy'; // เปิดใช้งานระบบ Lazy Loading ให้เว็บโหลดไว
            
            const info = document.createElement('div');
            info.className = 'gallery-info';
            info.innerText = cactusNames[i] || `cactus (${i}).jpg`;
            
            item.appendChild(img);
            item.appendChild(info);
            grid.appendChild(item);
        }

        // ฟังก์ชันเปิด Lightbox ขยายรูป
        function openLightbox(src, name, desc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxDesc = document.getElementById('lightboxDesc');
            
            lightboxImg.src = src;
            lightboxDesc.innerHTML = `<strong>${name}</strong><br>${desc}`;
            lightbox.style.display = 'flex';
        }

        // ฟังก์ชันปิด Lightbox
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>

<style>
* { box-sizing: border-box; margin:0; padding:0; }
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:20px 10px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#2d2d2d;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:15px;
}

.gallery a{
    position:relative;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
    background:#ffffff;
    aspect-ratio: 4/3;
    display:flex;
    align-items:center;
    justify-content:center;
}

.gallery .num{
    position:absolute;
    left:8px;
    bottom:8px;
    background:rgba(0,0,0,0.75);
    color:#fff;
    padding:4px 10px;
    border-radius:6px;
    font-size:15px;
    font-weight:bold;
    z-index:999;
}

.gallery img{
    max-width:95%;
    max-height:95%;
    width:auto;
    height:auto;
    display:block;
}

.gallery a:hover{
    transform:scale(1.03);
}

.back{
    display:block;
    width:200px;
    margin:40px auto 20px;
    text-align:center;
    padding:12px;
    background:#4CAF50;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
}
.back:hover{ background:#45a049; }
</style>
</head>

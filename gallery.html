<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px 10px; }
h1 { text-align: center; margin-bottom: 30px; color: #2d2d2d; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
.gallery .item { position: relative; border-radius: 15px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.15); background: #fff; cursor: pointer; }
.gallery .num { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.75); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 14px; font-weight: bold; z-index: 10; }
.gallery img { width: 100%; height: auto; display: block; transition: 0.2s; }
.gallery .item:hover img { transform: scale(1.05); }

/* ขยายรูปใหญ่เต็มจอที่สุด */
.lightbox { display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 9999; padding: 0; align-items: center; justify-content: center; cursor: pointer; }
.lightbox.show { display: flex; }
.lightbox img { max-width: 98vw; max-height: 98vh; width: auto; height: auto; object-fit: contain; }

.back { display: block; width: 200px; margin: 40px auto 20px; text-align: center; padding: 12px; background: #4CAF50; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; }
.back:hover { background: #45a049; }
</style>
</head>

const gallery = document.getElementById('gallery');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

photos.forEach((photo, index) => {
    const item = document.createElement('div');
    item.className = 'item';
    
    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = index + 1;
    
    const img = document.createElement('img');
    img.src = photo;
    img.loading = 'lazy';
    img.alt = 'รูปที่ ' + (index + 1);
    
    item.onclick = () => {
        lightboxImg.src = photo;
        lightbox.classList.add('show');
        document.body.style.overflow = 'hidden';
    };
    
    item.appendChild(num);
    item.appendChild(img);
    gallery.appendChild(item);
});

// กดที่รูปขยายก็ปิดกลับมาหน้าแกลลอรี่ทันที
lightbox.onclick = () => {
    lightbox.classList.remove('show');
    document.body.style.overflow = '';
    lightboxImg.src = '';
};
document.onkeydown = (e) => {
    if (e.key === 'Escape') {
        lightbox.classList.remove('show');
        document.body.style.overflow = '';
        lightboxImg.src = '';
    }
};

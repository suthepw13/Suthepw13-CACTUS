<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUTHEPW13 Cactus Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fbf9f3;       /* โทนสีครีมอุ่นสบายตา */
            --primary-color: #2e5a27;  /* สีเขียวต้นกระบองเพชร */
            --accent-color: #d27d2d;   /* สีส้มอิฐดอกไม้ */
            --card-bg: #ffffff;
            --text-dark: #2c2c2c;
            --text-light: #5f6368;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Mitr', 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 20px;
            min-height: 100vh;
        }

        /* ส่วนหัวข้อ (Header) */
        header {
            text-align: center;
            margin: 30px auto;
            max-width: 800px;
        }

        .gallery-title {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .gallery-title span.emoji {
            font-size: 2.4rem;
        }

        .gallery-subtitle {
            font-size: 1.1rem;
            color: var(--text-light);
            font-weight: 300;
            background-color: rgba(46, 90, 39, 0.08);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
        }

        .counter-num {
            font-weight: 500;
            color: var(--primary-color);
        }

        /* Grid ตารางรูปภาพ */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto 50px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            padding: 10px;
        }

        /* การ์ดรูปภาพแต่ละใบ */
        .photo-card {
            position: relative;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
            aspect-ratio: 1 / 1; /* แสดงผลแบบสี่เหลี่ยมจัตุรัสจัดเรียงเป็นระเบียบ */
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
        }

        .photo-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 20px rgba(46, 90, 39, 0.15);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ป้ายกำกับตัวเลขมุมล่างซ้าย */
        .photo-number {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 6px;
            backdrop-filter: blur(2px);
            pointer-events: none; /* เพื่อไม่ให้ขัดขวางการคลิกขยายรูป */
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* หน้าต่างขยายรูปภาพ (Lightbox Modal) */
        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 15, 10, 0.95); /* สีดำเหลือบเขียวเข้มหรูหรา */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .lightbox-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .lightbox-caption {
            color: #ffffff;
            margin-top: 15px;
            font-size: 1.1rem;
            font-family: 'Poppins', 'Mitr', sans-serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .lightbox-index {
            background-color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* ปุ่มปิดหน้าต่าง */
        .close-btn {
            position: absolute;
            top: -45px;
            right: 0;
            color: #ffffff;
            font-size: 2.2rem;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.2s, transform 0.2s;
        }

        .close-btn:hover {
            color: #ff6b6b;
            transform: scale(1.1);
        }

        /* ปุ่มควบคุม ซ้าย/ขวา */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-50%) scale(1.05);
        }

        .prev-btn {
            left: -80px;
        }

        .next-btn {
            right: -80px;
        }

        /* สไตล์หน้าจอขนาดเล็ก (Mobile Responsive) */
        @media (max-width: 768px) {
            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            .prev-btn {
                left: -10px;
                background: rgba(0,0,0,0.5);
            }
            .next-btn {
                right: -10px;
                background: rgba(0,0,0,0.5);
            }
            .close-btn {
                right: 10px;
                top: -50px;
            }
            .gallery-title {
                font-size: 1.8rem;
            }
            .gallery-container {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>

    <header>
        <h1 class="gallery-title"><span class="emoji">🌵</span> SUTHEPW13 Cactus Gallery</h1>
        <div class="gallery-subtitle">

        </div>
    </header>

    <main id="gallery-container" class="gallery-container"></main>

    <div id="lightbox" class="lightbox-modal">
        <div class="lightbox-content">

            <img id="lightbox-img" class="lightbox-img" src="" alt="Expanded View">
            
            <div class="lightbox-caption">
                <span id="lightbox-index" class="lightbox-index"></span>
            </div>
            
            <button id="next-btn" class="nav-btn next-btn" title="รูปถัดไป (➡️)">&gt;</button>
        </div>
    </div>

        const container = document.getElementById('gallery-container');
        const counterSpan = document.getElementById('photo-counter');

        // แสดงผลจำนวนรูปภาพทั้งหมดจากอาเรย์โดยอัตโนมัติ
        counterSpan.textContent = photos.length;

        // วนลูปเพื่อสร้างองค์ประกอบภาพแต่ละรูปบน Grid แกลเลอรี
        photos.forEach((src, index) => {
            const card = document.createElement('div');
            card.className = 'photo-card';
            
            // ใช้เทคโนโลยี HTML Lazy-Loading เพื่อประสิทธิภาพในการโหลดภาพจำนวนมาก
            const img = document.createElement('img');
            img.src = src;
            img.alt = `Cactus ${index + 1}`;
            img.loading = 'lazy';
            
            // สร้างป้ายตัวเลขกำกับที่มุมล่างซ้าย (เริ่มต้นจากเลข 1)
            const numberBadge = document.createElement('div');
            numberBadge.className = 'photo-number';
            numberBadge.textContent = index + 1;
            
            card.appendChild(img);
            card.appendChild(numberBadge);
            
            // ดักเหตุการณ์เมื่อคลิกเพื่อแสดงหน้าต่างขยายภาพใหญ่
            card.addEventListener('click', () => {
                openLightbox(index);
            });
            
            container.appendChild(card);
        });

        // ==================== ระบบการทำงานของ Lightbox (หน้าต่างขยายภาพใหญ่) ====================
        let currentIndex = 0;
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxIndex = document.getElementById('lightbox-index');

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // ป้องกันการเลื่อนเว็บหลักด้านหลังในขณะขยายรูป
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = ''; // คืนค่าการเลื่อนหน้าเว็บตามปกติ
        }

        function updateLightbox() {
            lightboxImg.src = photos[currentIndex];
            lightboxIndex.textContent = `รูปที่ ${currentIndex + 1} / ${photos.length}`;
        }

        // ฟังก์ชันเลื่อนภาพถอยหลัง (ก่อนหน้า)
        function prevImage() {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = photos.length - 1; // หากอยู่รูปแรกให้ย้อนกลับไปรูปสุดท้ายสุด
            }
            updateLightbox();
        }

        // ฟังก์ชันเลื่อนภาพไปข้างหน้า (ถัดไป)
        function nextImage() {
            if (currentIndex < photos.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0; // หากอยู่รูปสุดท้ายให้ข้ามกลับไปเริ่มที่รูปแรกใหม่
            }
            updateLightbox();
        }

        // การดักจับเหตุการณ์การทำงานกับปุ่มควบคุม
        document.getElementById('close-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            closeLightbox();
        });

        document.getElementById('prev-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            prevImage();
        });

        document.getElementById('next-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            nextImage();
        });

        // ดักเหตุการณ์เมื่อคลิกนอกพื้นที่ขยายรูปเพื่อปิด Lightbox สะดวกยิ่งขึ้น
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target.classList.contains('lightbox-content')) {
                closeLightbox();
            }
        });

        // เพิ่มการรองรับการกดคีย์บอร์ด (ลูกศร ซ้าย-ขวา และปุ่ม Esc) เพื่อการสไลด์ชมแกลเลอรีที่สะดวกสบาย
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            
            if (e.key === 'ArrowLeft') {
                prevImage();
            } else if (e.key === 'ArrowRight') {
                nextImage();
            } else if (e.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>

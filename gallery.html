<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuthepW13 Cactus - Gallery</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfbf7;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }
        h1 {
            color: #2e7d32;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 25px;
        }
        .btn-back {
            display: inline-block;
            padding: 10px 25px;
            background-color: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .btn-back:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
        }
        .card {
            background: #fff8e1;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
            background-color: #eaeaea;
        }
        .photo-count {
            color: #d32f2f;
            font-size: 1em;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌵 SuthepW13 Cactus Gallery 🌵</h1>
        <p class="subtitle">ภาพดอกแคคตัสสโนว์เดีย รวมทั้งหมด 514 รูป</p>
        <a href="index.html" class="btn-back">⬅ กลับหน้าหลัก</a>
    </header>

    <div class="container" id="gallery-container">
        </div>

    <script>
        const galleryContainer = document.getElementById('gallery-container');
        const totalImages = 514; // ดึงรูปทั้งหมด 514 รูป

        for (let i = 1; i <= totalImages; i++) {
            const card = document.createElement('div');
            card.className = 'card';

            const img = document.createElement('img');
            img.src = `gallery/cactus (${i}).jpg`;
            img.alt = `Cactus รูปที่ ${i}`;
            img.loading = 'lazy'; // ช่วยให้โหลดหน้าเว็บเร็วขึ้น ไม่ค้าง

            const label = document.createElement('div');
            label.className = 'photo-count';
            label.innerText = `รูปที่ ${i}`;

            card.appendChild(img);
            card.appendChild(label);
            galleryContainer.appendChild(card);
        }
    </script>

</body>
</html>

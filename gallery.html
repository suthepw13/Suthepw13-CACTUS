<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUTHEPW13 Cactus Gallery</title>
<style>
* {box-sizing: border-box; margin: 0; padding: 0;}
body {font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px 10px;}
h1 {text-align: center; margin-bottom: 30px; color: #2d2d2d;}
.gallery {display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px;}
.gallery .item {position: relative; border-radius: 8px; overflow: hidden; background: #fff; cursor: pointer;}
.gallery img {width: 100%; height: auto; display: block; transition: 0.2s;}
.gallery .num {position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.5); color: #fff; padding: 2px 6px; font-size: 12px; border-radius: 4px;}
.gallery .item:hover img {transform: scale(1.05);}
</style>
</head>
<body>
<h1>🌵 SUTHEPW13 Cactus Gallery <span id="total">(0 รูป)</span></h1>
<div class="gallery" id="gallery-box"></div>

<script>
fetch('gallery/')
.then(res => res.text())
.then(html => {
  const matches = html.match(/href="([^"]+\.jpg)"/g) || [];
  const files = matches.map(h => h.replace('href="','').replace('"',''));
  files.sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));

  document.getElementById('total').textContent = `(${files.length} รูป)`;
  const box = document.getElementById('gallery-box');

  files.forEach((file, idx) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <img src="gallery/${file}" loading="lazy">
      <div class="num">${idx+1}</div>
    `;
    box.appendChild(div);
  });
})
.catch(err => alert('โหลดรายการไม่ได้: '+err));
</script>
</body>

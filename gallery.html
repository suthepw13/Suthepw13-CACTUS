            229: "ถ่ายเมื่อ 2 กรกฎาคม 2024 - ลำต้นอิชินอปซิสทรงกระบอกอัดแน่นด้วยตาดอกตูมมีขนปุยปกคลุมจำนวนมาก ชูชันเตรียมพร้อมรับการเบ่งบานอย่างยิ่งใหญ่",
            230: "ถ่ายเมื่อ 2 กรกฎาคม 2024 - ดอกแอสโตรฟิตัมสีเหลืองทองแผ่กลีบแหลมคมบานสะพรั่งเต็มตา อวดเกสรสีส้มสดและเกสรตัวเมียรูปดาวแปดแฉกสีเหลืองสดใส",
            231: "ถ่ายเมื่อ 2 กรกฎาคม 2024 - ซูมมาโครดอกยิมโนสีชมพูอ่อนไล่เฉดสีชมพูเข้มตรงฐาน เผยรายละเอียดเกสรตัวเมียสีครีมและละอองเกสรตัวผู้สีเหลืองบางเบาดูประณีต",
            232: "ถ่ายเมื่อ 2 กรกฎาคม 2024 - ธรรมชาติอันแสนน่ารักเมื่อผึ้งตัวน้อยกำลังบินมาผสมเกสรใจกลางดอกสีเหลืองสว่างของแอสโตรฟิตัมในวันที่แดดดี",
            233: "ถ่ายเมื่อ 2 กรกฎาคม 2024 - ดอกอิชินอปซิสขาวบริสุทธิ์บานรับค่ำคืนในมุมย้อนแสงสลัว เผยใจกลางดอกสีเขียวมรกตและเกสรสีครีมพริ้วไหวดูสง่างามดั่งราชินีแห่งค่ำคืน",
            234: "ถ่ายเมื่อ 2 กรกฎาคม 2024 - มุมมองด้านบนของดอกอิชินอปซิสสีขาวสะอาดยามค่ำคืน โดดเด่นด้วยวงแหวนสีเขียวอ่อนตรงใจกลางที่โอบล้อมเกสรสีเหลืองครีมบานแผ่อย่างสมบูรณ์",
            235: "ถ่ายเมื่อ 23 มิถุนายน 2024 - บรรยากาศมุมรวมความสวยงามของเหล่าแคคตัสทั้งยิมโนและช้างดอกชมพู ที่พร้อมใจกันผลิบานหลากหลายเฉดสี ทั้งสีขาว พีช ชมพูเข้ม และชมพูพาสเทล",
            236: "ถ่ายเมื่อ 24 มิถุนายน 2024 - ซูมหน้าตรงดอกโลบิเวียสีส้มทองอมแดงสะท้อนแสงแดดจัดจ้า เผยกลีบดอกที่เงางามระยิบระยับคู่กับละอองหนามสีทองนุ่มนวลรอบลำต้น",
            237: "ถ่ายเมื่อ 24 มิถุนายน 2024 - การจัดหมวดหมู่ความสวยงามของ 3 กระถางโปรด โชว์ความต่างที่ลงตัวระหว่างแคคตัสช้างดอกใหญ่สีชมพู ยิมโนด่างดอกพวงสีหวาน และแอสโตรไร้หนามดอกสีเหลืองสด",
            238: "ถ่ายเมื่อ 1 กรกฎาคม 2024 - ซูมความสมบูรณ์ของยอดตาดอกยิมโนด่างที่กำลังเตรียมพร้อมเติบโต แสดงเกล็ดดอกสีชมพูอ่อนสลับเขียวดูแปลกตาตัดกับฉากหลังที่เป็นมิติพืชใบส้ม",
            239: "ถ่ายเมื่อ 2 กรกฎาคม 2024 - โฟกัสความงามดั่งเวทมนตร์ของเกสรตัวเมียสีเขียวตองอ่อนที่ยื่นพ้นกลุ่มเกสรตัวผู้สีเหลืองทอง ภายในถ้วยดอกสีขาวสลัวยามค่ำคืนของอิชินอปซิส",
            240: "ถ่ายเมื่อ 2 กรกฎาคม 2024 - ภาพรวมลำต้นอิชินอปซิสรูปทรงสูงสง่าที่รายล้อมรอบยอดด้วยตาดอกสีส้มพีชที่เตรียมแย้มบานพรั่งพรูท่ามกลางแสงไฟสลัวยามค่ำคืน",
            241: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ดอกอิชินอปซิสสีส้มพาสเทลบานพรั่งพรูพร้อมกันกว่าสิบดอกล้อมรอบลำต้นสีเขียวเข้มในมุมมองจากด้านบน",
            242: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - พุ่มดอกสีส้มพาสเทลบานชูช่อสง่างามตัดกับสนามหญ้าถั่วบราซิลสีเขียวและดอกสีเหลืองเล็กๆ ด้านหลังอย่างเป็นธรรมชาติ",
            243: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ลำต้นอิชินอปซิสทรงสูงโชว์ฟอร์มพุ่มดอกสีส้มอ่อนที่แผ่กระจายรอบทิศทางอย่างสมดุลและสวยงาม",
            244: "ถ่ายเมื่อ 2 กรกฎาคม 2024 - ดอกสีขาวบริสุทธิ์ของอิชินอปซิสบานสะพรั่งยามค่ำคืน โดดเด่นด้วยใจกลางสีเขียวมรกตและกลุ่มเกสรสีเหลืองทอง",
            245: "ถ่ายเมื่อ 2 กรกฎาคม 2024 - ทรวดทรงก้านดอกที่ชูชันจากลำต้นสีเขียว เผยดอกสีขาวที่กลีบนอกเป็นสีชมพูอมเขียวอ่อนดูพริ้วไหวในความมืด",
            246: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ดอกขาวขนาดใหญ่ที่ยังคงความเบ่งบานในยามเช้าตรู่รับแสงสว่าง เผยให้เห็นรัศมีกลีบดอกที่แผ่กว้างอย่างสง่างาม",
            247: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - บรรยากาศแสนอบอุ่นเมื่อฝูงผึ้งตัวน้อยพากันตอมเกสรดอกสีขาวขนาดใหญ่ใจกลางสีเขียวตองอ่อนอย่างมีความสุข",
            248: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ช่อดอกสีส้มพาสเทลบานกระจายตัวเป็นวงกลมเหนือลำต้นสีเข้ม จัดวางรับแดดอ่อนยามเช้าบนโต๊ะหิน",
            249: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ซูมมาโครดอกสีส้มอ่อน เผยวงแหวนเกสรตัวผู้สีครีมโอบล้อมเกสรตัวเมียรูปดาวสีเขียวตองอ่อนได้อย่างประณีต",
            250: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - โดดเด่นด้วยภาพมุมสูงของดอกอิชินอปซิสสีส้มพีชที่เรียงตัวลดหลั่นเป็นมงกุฎสองชั้นอย่างน่าประทับใจ",
            251: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ความสวยงามของสองสายพันธุ์เมื่อดอกอิชินอปซิสสีขาวและสีส้มพาสเทลบานพร้อมกันอย่างอลังการในวันเดียวกัน",
            252: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - กลุ่มตาดอกสีส้มกว่าสิบดอกที่เริ่มแย้มกลีบเป็นกระเปาะกลม ชูชันเป็นรัศมีรอบยอดต้นยามค่ำคืน",
            253: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ซูมด้านข้างดอกโลบิเวียสีชมพูอมส้มทองอวดความเงางามของกลีบดอกตัดกับหนามแหลมคมของลำต้นสีเขียวสด",
            254: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ดอกโลบิเวียสีส้มชมพูบานสะพรั่งอวดเกสรสีครีมสะท้อนแดดอ่อน เคียงคู่กับลำต้นที่แข็งแรงและกระถางเรียงราย",
            255: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - คู่ดอกอิชินอปซิสสีส้มบานประชันความสวยเหนือกิ่งก้านของลำต้นสีเขียวเข้มบั้งหนามละเอียด",
            256: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ดอกสีขาวและส้มพีชบานพร้อมกันในวันเดียว สะท้อนถึงการดูแลเอาใจใส่เป็นอย่างดีจนออกดอกสะพรั่งพร้อมพรั่ง",
            257: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - รายละเอียดดอกคู่สีพีชบานสะพรั่ง เห็นชั้นกลีบดอกที่อ่อนนุ่มไล่ระดับเฉดสีอย่างกลมกลืนเป็นธรรมชาติ",
            258: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ตาดอกส้มกลมโตที่เริ่มคลี่คลายกลีบดอกยามดึก ชูเป็นกิ่งรัศมีรอบยอดต้นสะท้อนแสงไฟระยิบระยับ",
            259: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - การจัดระเบียบตาดอกตูมสีส้มรอบยอดต้นที่รอวันผลิบาน เผยเงาของกิ่งก้านตุ่มหนามทอดตัวสวยงามบนพื้นกระเบื้อง",
            260: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ปิดท้ายชุดด้วยมุมมองกว้างของต้นแม่พุ่มใหญ่ ที่ออกดอกสีส้มพาสเทลสะพรั่งเต็มต้นนับสิบดอกอย่างอลังการและสง่างาม",
            261: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ดอกอิชินอปซิสสีส้มพีชแสนหวาน คลี่กลีบซ้อนบางเบารับลมอย่างอบอุ่นในมุมมองหน้าตรงจากด้านบน",
            262: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - โชว์ก้านดอกยาวเรียวของพุ่มดอกส้มที่ชูชันจากยอดลำต้นสีเขียวเข้มสู้แสงแดดจ้ายามเช้าตรู่",
            263: "ถ่ายเมื่อ 4 กรกฎาคม 2024 - ดอกโลบิเวียสีชมพูอมแดงสดใสบานพราวคู่กัน ดึงดูดผึ้งตัวน้อยให้แวะเวียนมาเก็บเกสรอย่างมีชีวิตชีวา",
            264: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ภาพรวมลำต้นอิชินอปซิสทรงสูงที่ออกช่อดอกสีส้มบานสะพรั่งเป็นกลุ่มก้อนอย่างสวยงามและเป็นธรรมชาติ",
            265: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - มุมซูมท็อปวิวของพุ่มดอกสีส้มพีชที่คลี่บานล้อมรอบยอดต้น ดั่งมงกุฎดอกไม้ประดับสวนยามเช้า",
            266: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ดอกขาวขนาดใหญ่ของอิชินอปซิสที่แย้มบานในยามเช้า เผยเกสรกระจายตัวพริ้วไหวและก้นถ้วยดอกสีเขียวมรกต",
            267: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ดอกสีส้มพาสเทลสองดอกบานรับแดดอ่อนยามเช้า อวดความพริ้วไหวบางเบาของกลีบดอกที่มีผึ้งแวะเวียนมาผสมเกสร",
            268: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ช่อดอกสีพีชบานสะพรั่งเต็มพุ่มท้าแดดยามเช้า บันทึกความสดใสของสีดอกไม้ในโทนอบอุ่นละมุนตา",
            269: "ถ่ายเมื่อ 4 กรกฎาคม 2024 - ดอกโลบิเวียสีชมพูอมส้มทองบานสะพรั่งเป็นกระจุก ล้อมรอบด้วยฝูงผึ้งบินว่อนรุมตอมเกสรอย่างหนาตา",
            270: "ถ่ายเมื่อ 4 กรกฎาคม 2024 - ลำต้นโลบิเวียทรงกระบอกสูงชูดอกสีชมพูเข้มท้าลมฝน โดยมีฉากหลังเป็นทิวทัศน์ริมถนนที่ดูชุ่มชื้นสบายตา",
            271: "ถ่ายเมื่อ 5 กรกฎาคม 2024 - ดอกยิมโนสีชมพูพาสเทลสดใสบานตรงยอดในมุมมองท็อปวิว โชว์กลีบดอกหยักพริ้วสวยงามตัดกับหนามบั้งสีเข้มรอบต้น",
            272: "ถ่ายเมื่อ 4 กรกฎาคม 2024 - ดอกโลบิเวียสีชมพูส้มสดใสสองดอกบานอวดเกสรสวยงามด้านล่างของยอดต้นแคคตัสทรงสูงที่จัดระเบียบไว้อย่างดี",
            273: "ถ่ายเมื่อ 5 กรกฎาคม 2024 - ซูมมาโครดอกยิมโนสีชมพูอ่อน เผยเกสรตัวผู้สีเหลืองทองที่เรียงตัวเป็นระเบียบโอบล้อมเกสรตัวเมียใจกลางดอกสีครีม",
            274: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ช่อดอกสีส้มพาสเทลบานกระจายรอบทิศทางอย่างอลังการ โดยมีป้ายบ้านเลขที่โลหะสีทองหรูหราเป็นฉากหลังอย่างมีสไตล์",
            275: "ถ่ายเมื่อ 3 กรกฎาคม 2024 - ลำต้นอิชินอปซิสทรงสูงรายล้อมด้วยช่อดอกตูมสีส้มและดอกบานสะพรั่งบางส่วน จัดวางเด่นเป็นสง่าเคียงคู่กับรูปปั้นดินเผารูปสุนัขสีน้ำเงินขาว",
            276: "ถ่ายเมื่อ 4 กรกฎาคม 2024 - ดอกโลบิเวียสีชมพูอมแดงสดใสบานชูช่อเคียงคู่กับแมมมิลาเรียขนนกสีขาวฟูนุ่มละมุนตา สร้างความตัดกันของสองขั้วอย่างลงตัว",
            277: "ถ่ายเมื่อ 4 กรกฎาคม 2024 - ภาพซูมรายละเอียดช่อดอกโลบิเวียสีชมพูอมส้ม แสดงมิติกลีบดอกที่บานแผ่กว้างต้อนรับแสงแดดแรกของวัน",
            278: "ถ่ายเมื่อ 4 กรกฎาคม 2024 - กลุ่มช่อดอกโลบิเวียบานคู่ลดหลั่นระดับความสูงของก้านดอก เผยเกสรอันสมบูรณ์ที่มีผึ้งน้อยแวะเวียนมาเก็บน้ำหวาน",
            279: "ถ่ายเมื่อ 4 กรกฎาคม 2024 - บรรยากาศการรวมกลุ่มของเหล่าแคคตัสหลากกระถางบนระเบียงบ้าน ชูช่อดอกไม้สีแดงอมชมพูสดใสอย่างกระปรี้กระเปร่ายามเช้า",
            280: "ถ่ายเมื่อ 4 กรกฎาคม 2024 - ปิดท้ายชุดด้วยมุมมองท็อปวิวรวมกระถางแคคตัส 3 สายพันธุ์ ทั้งแมมขนนกขาวฟูและโลบิเวียดอกชมพูแดง บานสะพรั่งอวดเฉดสีตัดกันอย่างมีชีวิตชีวา",
            281: "ถ่ายเมื่อ 9 กรกฎาคม 2024 - ดอกยิมโนสีชมพูอ่อนอมน้ำตาลพาสเทล คลี่กลีบบานสะพรั่งอวดเกสรหนาแน่นสีน้ำตาลเทาใจกลางดอกอย่างประณีต",
            282: "ถ่ายเมื่อ 9 กรกฎาคม 2024 - มุมมาโครของดอกยิมโนสีชมพูนู้ด แสดงรูปทรงกลีบดอกปลายแหลมสลับซ้อนหลายชั้นและใจกลางเกสรสีครีมละมุนตา",

            309: "ถ่ายเมื่อ 18 กรกฎาคม 2024 - ดอกอิชินอปซิสคู่สีชมพูพาสเทลสว่างไสวยามค่ำคืน บานแผ่อย่างละมุนเคียงข้างฉากหลังสลัว",

            323: "โชว์ความงามร่วมกันของสองกระถางโปรด ด้านซ้ายเป็นยิมโนดอกขาวพราวเสน่ห์ที่มีหยดน้ำฝนเกาะบางเบา ส่วนด้านขวาเป็นยิมโนด่างลายสีแดงสลับเขียวอวดดอกสีเขียวตองอ่อนน่ารัก",

            334: "ถ่ายเมื่อ 11 สิงหาคม 2024 - ซูมมาโครใจกลางดอกแคคตัสช้างสีชมพูหวานแหวว เผยให้เห็นก้นถ้วยดอกสีแดงเข้มและเกสรตัวผู้สีเหลืองทองอัดแน่นน่ามอง",

            339: "ถ่ายเมื่อ 2 กันยายน 2025 - บรรยากาศมุมรวมของเหล่าแคคตัสหลากกระถางบนระเบียงบ้าน โดดเด่นด้วยดอกอิชินอปซิสสีขาวชูชันยาวพุ่งเด่นเคียงคู่กระถางรอบข้าง",
            340: "ถ่ายเมื่อ 2 กันยายน 2025 - ซูมมาโครลำต้นสีเขียวเข้มทรงกระบอกชูตาดอกตูมสีเขียวสดปกคลุมด้วยขนสีขาวเงินหนาแน่น ดั่งเส้นใยธรรมชาติห่อหุ้มกลีบดอกตูม",

            390: "ถ่ายเมื่อ 3 กันยายน 2025 - ภาพมุมเฉียงเผยให้เห็นความละเอียดพริ้วบางของกลีบดอกส้มที่เรียงซ้อนทับกันอย่างมีระเบียบเหนือก้านชูดอกสีส้มปนเขียว",
            391: "ถ่ายเมื่อ 3 กันยายน 2025 - พุ่มดอกอิชินอปซิสสีส้มพีชบานสะพรั่งเป็นมงกุฎรอบยอดลำต้นทรงสูงในกระถางสีน้ำเงินที่ตั้งเด่นเคียงข้างความมืดมิด",
            392: "ถ่ายเมื่อ 3 กันยายน 2025 - ภาพมุมมองเฉียงรวมสองกระถางคู่แสดงความต่างที่ลงตัวระหว่างพุ่มดอกส้มสะพรั่งของทั้งสองต้นที่เติบโตสมบูรณ์และพรั่งพรู",
            393: "ถ่ายเมื่อ 3 กันยายน 2025 - โคลสอัพความงามของพุ่มดอกสีส้มพาสเทล 4 ดอกที่บานกระจุกรวมกัน เผยให้เห็นวงเกสรสีเหลืองระยิบระยับประดับผิวกลีบดอกอ่อนละมุน",
            394: "ถ่ายเมื่อ 3 กันยายน 2025 - ซูมด้านข้างโชว์มิติความพริ้วและกลีบซ้อนทับกันอย่างบางเบาของดอกสีส้มแสด ค่อย ๆ คลี่บานสลัดความชื้นยามเช้ามืด",
            395: "ถ่ายเมื่อ 3 กันยายน 2025 - ภาพเฉียงด้านข้างของสองกระถางคู่ เผยทรวดทรงดอกสีส้มและลำต้นที่แข็งแรงตั้งตรงเคียงคู่กระถางข้างเคียงในร่มเงา",
            396: "ถ่ายเมื่อ 3 กันยายน 2025 - ภาพพุ่มดอกอิชินอปซิสสีส้มพีชบานสะพรั่งเป็นวงรอบยอดต้น เผยความงามที่สมส่วนเหนือกระถางดินเผาที่มีก้อนอิฐมอญจัดวางประดับ",
            397: "ถ่ายเมื่อ 3 กันยายน 2025 - ดอกอิชินอปซิสสีส้มพีชในมุมมองท็อปวิว โชว์ความบานสะพรั่งแผ่กิ่งก้านรัศมีรอบยอดต้นสีเขียวเข้มบั้งหนามละเอียดเด่นตา",
            398: "ถ่ายเมื่อ 3 กันยายน 2025 - ชูดอกสีส้มแสดบานพรั่งพร้อมประชันกันสองกระถางคู่ จัดวางเด่นเป็นสง่าท่ามกลางความสลัวของร่มไม้ยามใกล้เช้า",
            399: "ถ่ายเมื่อ 3 กันยายน 2025 - มุมมองท็อปวิวจากด้านบนโชว์การจัดเรียงตัวของดอกสีส้มแสดที่คลี่ชั้นกลีบซ้อนพริ้วไหวบางเบาอย่างสมดุลล้อมรอบยอดต้นสีเขียวเข้ม",
            400: "ถ่ายเมื่อ 3 กันยายน 2025 - ภาพมุมมองท็อปวิวของพุ่มดอกสีส้มพาสเทลสะพรั่งเต็มต้นนับสิบดอก จัดวางเด่นเหนือพื้นแผ่นแกรนิตในความมืดสลัว",
            401: "ถ่ายเมื่อ 3 กันยายน 2025 - ดอกอิชินอปซิสสีส้มพาสเทลบานเคียงคู่กันยามเช้ามืด เผยกลีบดอกซ้อนพริ้วบางสะท้อนแสงไฟสลัวดูอบอุ่นละเอียดอ่อน",
            402: "ถ่ายเมื่อ 3 กันยายน 2025 - ภาพระยะใกล้ของดอกอิชินอปซิสสีส้มพีช คลี่กลีบซ้อนพริ้วไหวเหนือลำต้นสีเขียวเข้มในกระถางสีน้ำเงิน",
            403: "ถ่ายเมื่อ 3 กันยายน 2025 - ซูมมาโครดอกสีส้มแสดกลีบพริ้วบางรับแดดเช้า เผยวงเกสรตัวผู้สีเหลืองทองหนาแน่นล้อมรอบเกสรตัวเมียสีเขียวตองอ่อนอย่างประณีต",
            404: "ถ่ายเมื่อ 3 กันยายน 2025 - ดอกสีส้มพีชแผ่กลีบรับแสงอาทิตย์อ่อน ๆ ยามเช้า เผยเฉดสีกลีบที่ไล่สีบางเบาและตุ่มหนามของลำต้นด้านหลัง",
            405: "ถ่ายเมื่อ 3 กันยายน 2025 - ภาพเฉียงโชว์ความพริ้วไหวของกลีบดอกส้มสะท้อนแดดยามสาย ขับให้ผิวกลีบดูมีมิติตัดกับขนปุยของตาดอกตูมด้านหลัง",
            406: "ถ่ายเมื่อ 3 กันยายน 2025 - มุมท็อปวิวของดอกสีส้มแสดที่บานเต็มที่ล้อมรอบยอดต้นสีเขียวเข้ม โชว์ความงามของชั้นกลีบที่สมสัดส่วนตามธรรมชาติ",
            407: "ถ่ายเมื่อ 3 กันยายน 2025 - ชูดอกสีส้มพาสเทลบานสะพรั่งเป็นกระจุกพรั่งพรูรอบยอดลำต้นทรงสูงรับแสงแดดวันใหม่อย่างสดชื่น",
            408: "ถ่ายเมื่อ 3 กันยายน 2025 - ภาพรวมต้นอิชินอปซิสทรงกระบอกเด่นสะดุดตา ชูช่อดอกสีส้มบานเป็นรัศมีโอบล้อมรอบยอดต้นอย่างสง่างาม",
            409: "ถ่ายเมื่อ 3 กันยายน 2025 - ดอกสีส้มพีชบานสะพรั่งเต็มยอดเหนือลำต้นในกระถางดินเผาที่มีก้อนอิฐมอญจัดวางประดับในบรรยากาศสวนยามเช้า",
            410: "ถ่ายเมื่อ 3 กันยายน 2025 - โดดเด่นด้วยภาพมุมสูงของดอกอิชินอปซิสสีส้มพีชบานแผ่กว้างล้อมรอบลำต้นสีเขียวเข้ม บันทึกรายละเอียดสีสันโทนอบอุ่น",
            411: "ถ่ายเมื่อ 3 กันยายน 2025 - ความงามร่วมกันเมื่อดอกอิชินอปซิสสองกระถางสีขาวและสีส้มแผ่บานรับวันใหม่ เคียงคู่ฉากหลังต้นมะละกอสีเขียวชุ่มชื้นสบายตา",
            412: "ถ่ายเมื่อ 3 กันยายน 2025 - ภาพมุมกว้างหน้าระเบียงบ้าน โชว์ความงามของดอกแคคตัสทั้งสองต้นที่ผลิบานพร้อมกัน เติมเต็มสีสันสดใสให้สวนขนาดเล็กอย่างลงตัว",
            413: "ถ่ายเมื่อ 2 กันยายน 2025 - ดอกสีขาวบริสุทธิ์ของอิชินอปซิส ค่อย ๆ คลี่บานสลัดความชื้นบนก้านชูดอกชูชันมีขนละเอียดในมุมมองด้านข้าง",
            414: "ถ่ายเมื่อ 2 กันยายน 2025 - ดอกยิมโนสีชมพูพาสเทลกลีบซ้อนหนาแน่น คลี่บานสวยงามประดับอยู่เหนือลำต้นสีเขียวเข้มและหนามแหลมคม",
            415: "ถ่ายเมื่อ 2 กันยายน 2025 - ภาพซูมระยะใกล้โชว์กลีบดอกยิมโนสีชมพูนู้ดซ้อนกันอย่างมีศิลปะ เผยเกสรใจกลางดอกสีครีมละมุนตา",
            416: "ถ่ายเมื่อ 3 กันยายน 2025 - ดอกอิชินอปซิสสีส้มแสดพวงใหญ่ผลิบานพรั่งพรูเหนือลำต้นทรงกระบอกสีเขียวเข้มท่ามกลางความเงียบสงบยามเช้ามืด",
            417: "ถ่ายเมื่อ 2 กันยายน 2025 - ดอกแมมสีชมพูหวานแหววบานสะพรั่งอวดเกสรตัวเมียรูปดาวสีเขียวตองอ่อน ตัดกับแนวหนามขาวละเอียดรอบต้น",
            418: "ถ่ายเมื่อ 3 กันยายน 2025 - ชูดอกสีส้มพีชบานสะพรั่งรอบยอดลำต้นทรงสูงในกระถางดินเผาที่มีก้อนอิฐมอญจัดวางประดับยามค่ำคืน",

            420: "ถ่ายเมื่อ 3 กันยายน 2025 - ความงามยามดึกเมื่อต้นอิชินอปซิสทั้งสองกระถางพร้อมใจกันเบ่งบานช่อดอกสีส้มพาสเทลประชันความสวยงามอย่างอลังการ",
            421: "ถ่ายเมื่อ 3 กันยายน 2025 - พุ่มดอกส้มพีชบานเต็มที่เหนือลำต้นในกระถางดินเผาที่มีก้อนอิฐมอญจัดวางเคียงคู่กันอย่างคลาสสิกยามดึก",
            422: "ถ่ายเมื่อ 3 กันยายน 2025 - ดอกอิชินอปซิสสีส้มแสดคลี่กลีบดอกซ้อนพริ้วบางอย่างหนาแน่นอวดโฉมสะท้อนแสงไฟยามค่ำคืนในกระถางสีน้ำเงิน",
            423: "ถ่ายเมื่อ 3 กันยายน 2025 - ภาพเจาะจงรายละเอียดเกสรตัวผู้สีเหลืองทองโอบล้อมเกสรตัวเมียสีเขียวตองอ่อน ท่ามกลางกลีบดอกสีส้มพีชอ่อนนุ่ม",
            424: "ถ่ายเมื่อ 3 กันยายน 2025 - ดอกสีส้มพีชเริ่มผลิกลีบกลมโตเตรียมแย้มบาน ชูชันเป็นรัศมีสวยล้อมรอบยอดลำต้นสีเขียวในมุมมองท็อปวิว",
            425: "ถ่ายเมื่อ 3 กันยายน 2025 - ดอกสีส้มแสดคลี่กลีบบานแผ่กว้างเต็มที่ เผยรายละเอียดชั้นกลีบดอกพริ้วไหวสะท้อนแสงไฟสลัวดูละเอียดอ่อน",

            428: "ถ่ายเมื่อ 3 กันยายน 2025 - ดอกสีส้มแสดบานประดับเหนือลำต้นในกระถางดินเผา เผยให้เห็นสลัวของฉากหลังและอิฐมอญที่จัดวางประดับสวนอย่างลงตัว",
            429: "ถ่ายเมื่อ 3 กันยายน 2025 - ซูมด้านข้างของดอกคู่สีพีชพาสเทลที่ซ้อนกลีบหนาแน่นละมุนตา แสดงความสมบูรณ์แข็งแรงของพืชที่ได้รับการดูแลเป็นอย่างดี",
            430: "ถ่ายเมื่อ 3 กันยายน 2025 - ดอกสีส้มแสดบานสะพรั่งรับมุมมองหน้าตรง เผยชั้นกลีบพริ้วสลับเฉดสีทองอบอุ่นท่ามกลางแสงไฟยามดึก",
            431: "ถ่ายเมื่อ 11 สิงหาคม 2024 - ดอกอิชินอปซิสสีส้มพาสเทลบานแผ่ออกอย่างประณีต เผยให้เห็นเกสรตัวผู้สีเหลืองทองหนาแน่นและเกสรตัวเมียสีเขียวตองอ่อนใจกลางดอก",
            432: "ความงามร่วมกันของสองกระถางโปรด ด้านซ้ายเป็นยิมโนดอกขาวพราวเสน่ห์มีหยดน้ำเกาะบางเบา ส่วนด้านขวาเป็นยิมโนด่างดอกสีเขียวตองอ่อนแสนน่ารัก",
            433: "ถ่ายเมื่อ 11 สิงหาคม 2024 - ช่อดอกสีส้มแสดบานสะพรั่งเป็นกลุ่มก้อนเหนือลำต้นสีเขียวเข้มบั้งหนามถี่เด่นชัดในวันที่แดดดี",
            434: "ถ่ายเมื่อ 19 กันยายน 2024 - ดอกอิชินอปซิสสีส้มแสดบานแผ่กว้างต้อนรับแสงอาทิตย์อ่อน ๆ ยามเช้า เผยมิติเฉดสีกลีบดอกที่อบอุ่นนุ่มนวล",
            435: "ถ่ายเมื่อ 19 กันยายน 2024 - ภาพมุมเฉียงโชว์กลีบดอกสีส้มอมชมพูไล่เฉดหวานซ้อนกันพริ้วบางอย่างประณีตเหนือก้านดอกตูมด้านหลัง",
            436: "ถ่ายเมื่อ 19 กันยายน 2024 - ดอกสีส้มแสดบานหน้าตรงรับมุมมอง เผยเกสรตัวผู้สีเหลืองทองกระจายตัวพริ้วไหวโอบล้อมเกสรตัวเมียรูปดาวสีเขียวอ่อน",
            437: "ดอกยิมโนคู่สีขาวนวลกลีบเรียว ค่อย ๆ แย้มบานอวดเกสรสีน้ำตาลนุ่มนวลใจกลางดอกเด่นตาตัดกับลำต้นสีเขียวเข้มบั้งคม",
            438: "ช่อดอกยิมโนสีชมพูอ่อนกลีบเรียว บานสะพรั่งพร้อมกันเป็นพวงกระจายล้อมยอดต้นกลมมนดูอ่อนหวานและสดชื่นพริ้วไหว",
            439: "ถ่ายเมื่อ 11 สิงหาคม 2024 - ภาพมุมมองหน้าตรงระยะไกลของต้นอิชินอปซิสทรงกระบอกสูง ชูดอกสีส้มพาสเทลบานสะพรั่งเป็นรัศมีโอบล้อมยอดต้นอย่างสง่างาม",
            440: "ถ่ายเมื่อ 11 สิงหาคม 2024 - ซูมมาโครใจกลางดอกแคคตัสช้างสีชมพูหวานแหวว เผยเกสรสีเหลืองทองและใจกลางเกสรตัวเมียรูปดาวสีครีมสะดุดตา",
            441: "ถ่ายเมื่อ 11 สิงหาคม 2024 - ลำต้นอิชินอปซิสทรงกระบอกเด่นชูดอกสีส้มพาสเทลและตาดอกตูมที่ชูรอบด้าน ดูมั่นคงและสมดุลเป็นธรรมชาติ",

        for (let i = 1; i <= total; i++) {

            div.className = 'card';
            const nameLabel = cactusNames[i] ? `รูปที่ ${i}: ${cactusNames[i]}` : `รูปที่ ${i}`;
            div.innerHTML = `
                <img src="gallery/cactus (${i}).jpg" loading="lazy" onerror="this.src='https://via.placeholder.com/220x200?text=Cactus+${i}'">
                <div style="margin-top: 8px; font-weight: bold; font-size: 13px;">${nameLabel}</div>
            `;
            div.onclick = () => { current = i; show(i); };
            container.appendChild(div);
        }
 const endBanner = document.createElement('div');
        endBanner.style.cssText = "grid-column: 1 / -1; text-align: center; margin: 40px 0 20px 0; padding-top: 30px; border-top: 1px dashed #ccc; color: #7f8c8d; font-size: 1.1rem;";
        endBanner.innerHTML = "✨ สิ้นสุดการนำเสนอคอลเลกชัน Xiaomi 13T (รวมทั้งสิ้น 497 รูปภาพ) ✨<br><small style='color: #bdc3c7; font-size: 0.85rem; display: block; margin-top: 8px;'>- ขอบคุณที่รับชม -</small>";
        container.appendChild(endBanner);


        function show(i) {
            document.getElementById('lightbox-img').src = `gallery/cactus (${i}).jpg`;
            const name = cactusNames[i] ? `รูปที่ ${i}: ${cactusNames[i]}` : `รูปที่ ${i}`;
            const desc = cactusDesc[i] ? `<div class="desc-text">${cactusDesc[i]}</div>` : '';
            document.getElementById('lightbox-caption').innerHTML = `<strong>${name}</strong>${desc}`;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function changeImage(dir) {
            current += dir;
            if (current < 1) current = total;
            if (current > total) current = 1;
            show(current);
        }

        document.addEventListener('keydown', (e) => {
            if(document.getElementById('lightbox').style.display === 'flex') {
                if(e.key === 'ArrowLeft') changeImage(-1);
                if(e.key === 'ArrowRight') changeImage(1);
                if(e.key === 'Escape') document.getElementById('lightbox').style.display = 'none';
            }
        });
    </script>
</body>
</html>

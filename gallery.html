<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUTHEPW13 Cactus Gallery</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px 10px; }
    h1 { text-align: center; margin-bottom: 30px; color: #2d2d2d; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .gallery .item { position: relative; border-radius: 15px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.15); background: #fff; cursor: pointer; }
    .gallery .num { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.75); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 14px; font-weight: bold; z-index: 10; }
    .gallery img { width: 100%; height: auto; display: block; transition: 0.2s; }
    .gallery .item:hover img { transform: scale(1.05); }
    .back { display: block; width: 200px; margin: 40px auto 20px; text-align: center; padding: 12px; background: #4CAF50; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; }
</style>
</head>
<body>
<h1>🌵 SUTHEPW13 Cactus Gallery</h1>
<div class="gallery" id="gallery"></div>
<a class="back" href="index.html">กลับหน้าแรก</a>

// โค้ดนี้จะไปดึงรูปทั้งหมดในโฟลเดอร์ gallery โดยอัตโนมัติ

</script>
</body>
</html>

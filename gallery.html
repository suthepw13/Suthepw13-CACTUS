        #lightbox .desc { margin-top: 15px; font-size: 16px; text-align: center; max-width: 800px; padding: 0 20px; }

        // สร้าง Grid รูปภาพ 1-100 พร้อมระบบ Lazy Loading
        const grid = document.getElementById('galleryGrid');
        for (let i = 1; i <= 100; i++) {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.onclick = () => openLightbox(`cactus (${i}).jpg`, cactusNames[i] || `Cactus ${i}`, cactusDesc[i] || '');
            
            const img = document.createElement('img');
            img.src = `cactus (${i}).jpg`;
            img.alt = `Cactus ${i}`;
            img.loading = 'lazy'; // เปิดใช้งานระบบ Lazy Loading ให้เว็บโหลดไว
            
            const info = document.createElement('div');
            info.className = 'gallery-info';
            info.innerText = cactusNames[i] || `cactus (${i}).jpg`;
            
            item.appendChild(img);
            item.appendChild(info);
            grid.appendChild(item);
        }

        // ฟังก์ชันเปิด Lightbox ขยายรูป
        function openLightbox(src, name, desc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxDesc = document.getElementById('lightboxDesc');
            
            lightboxImg.src = src;
            lightboxDesc.innerHTML = `<strong>${name}</strong><br>${desc}`;
            lightbox.style.display = 'flex';
        }

        // ฟังก์ชันปิด Lightbox
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>

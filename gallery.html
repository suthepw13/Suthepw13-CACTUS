<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuthepW13 Cactus Gallery</title>
    <!-- ใช้ Font Sarabun เพื่อความเป็นไทยที่ดูดี -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 250px; /* กำหนดความสูงคงที่เพื่อให้ Grid ดูเป็นระเบียบ */
            object-fit: cover; /* ตัดภาพส่วนที่เกินเพื่อให้เต็มกรอบพอดี */
            display: block;
        }

        .gallery-info {
            padding: 15px;
            text-align: center;
        }

        .gallery-info .img-num {
            font-size: 1.1em;
            font-weight: bold;
            color: #e67e22; /* สีส้มเด่นชัดสำหรับเลขรูป */
            margin-bottom: 5px;
            display: block;
        }

        .gallery-info .species {
            font-size: 1em;
            color: #2c3e50;
            font-weight: 700;
        }

        /* ส่วนข้อความปิดท้าย */
        .footer-end-text {
            text-align: center;
            color: #7f8c8d; /* สีเทาอ่อน */
            font-size: 1.1em;
            margin-top: 50px;
            margin-bottom: 30px;
            border-top: 2px solid #bdc3c7; /* เส้นคั่นด้านบน */
            padding-top: 20px;
        }

        /* --- Lightbox Modal Styles --- */
        #lightbox {
            display: none; /* ซ่อนไว้เริ่มต้น */
            position: fixed;
            z-index: 1000; /* ให้อยู่เหนือทุกอย่าง */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* พื้นหลังดำโปร่งแสง */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #fff;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #lightbox.open {
            display: flex;
            opacity: 1;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 80vh; /* จำกัดความสูงภาพไม่ให้ล้นหน้าจอ */
            border: 5px solid #fff;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        #lightbox .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        #lightbox .close-btn:hover {
            color: #e74c3c; /* สีแดงเมื่อชี้ */
        }

        #lightbox .desc {
            margin-top: 20px;
            font-size: 1.2em;
            text-align: center;
            max-width: 80%;
            padding: 0 20px;
        }

        #lightbox .desc strong {
            color: #f1c40f; /* สีเหลืองทองสำหรับชื่อสายพันธุ์ใน Lightbox */
        }

        #lightbox .desc p {
            margin: 5px 0 0 0;
            color: #ecf0f1;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <h1>SuthepW13 Cactus Gallery</h1>

    <div class="gallery-grid" id="galleryGrid">
        <!-- รูปภาพจะถูกเติมที่นี่ด้วย JavaScript -->
    </div>

    <!-- ข้อความปิดท้าย -->
    <div class="footer-end-text">
        --- สิ้นสุดภาพแคคตัสในอดีต (500 รูป) ---
    </div>

    <!-- --- Lightbox Modal Structure --- -->
    <div id="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <img id="lightboxImg" src="" alt="Cactus Enlarged">
        <div class="desc" id="lightboxDesc">
            <!-- ข้อมูลชื่อสายพันธุ์และคำบรรยายจะถูกเติมที่นี่ -->
        </div>
    </div>

    <script>
        // --- ส่วนข้อมูล (Data Zone) ---
        // 1. ทะเบียนชื่อสายพันธุ์ (ดึงมาเฉพาะบางส่วนเพื่อตัวอย่าง)
        const cactusNames = {
            // (ข้อมูล 1-465 เหมือนเดิม)
            // ...
            465: "Combo (แคคตัสรวมหลายกระถาง)",
            466: "Gymnocalycium (ยิมโน - *รูปใหม่*)", // อัปเดตข้อมูลรูป 466 (แคคตัสใหม่)
            467: "Gymnocalycium (ยิมโน)",
            // (ข้อมูล 468-490 เหมือนเดิม)
            // ...
            491: "Gymnocalycium (ยิมโน)",
            492: "Gymnocalycium (ยิมโน)",
            493: "Gymnocalycium (ยิมโน)",
            494: "Gymnocalycium (ยิมโน)",
            495: "Gymnocalycium (ยิมโน)",
            496: "Hlectranthus (เนียมหูเสือ/พรมออสเตรเลีย? - *รอตรวจสอบ*)",
            497: "Gymnocalycium (ยิมโนด่าง)",
            498: "Combo (แคคตัสรวมหลากหลายสายพันธุ์ - ภาพคอลลาจ)",
            499: "Combo (แคคตัสรวมหลากหลายสายพันธุ์ - ภาพคอลลาจ)",
            500: "Combo (แคคตัสรวมหลากหลายสายพันธุ์ - ภาพคอลลาจ)"
        };

        // 2. ทะเบียนคำบรรยายและเกร็ดความรู้
        const cactusDesc = {
            // (ข้อมูล 1-465 เหมือนเดิม)
            // ...
            465: "ถ่ายเมื่อ 22/09/2025 08:19 น. - กลุ่มแคคตัสออกดอกพร้อมกันหลายสายพันธุ์ สวยงามอลังการ",
            466: "ภาพถ่ายแคคตัสยิมโนรูปใหม่ (ทดแทนภาพบุคคลเดิม) โชว์ฟอร์มพูและหนามที่สวยงาม", // อัปเดตคำบรรยายรูป 466 (แคคตัสใหม่)
            467: "ถ่ายเมื่อ 23/09/2025 13:31 น. - ยิมโนออกดอกสีครีมนวล กลีบซ้อนเรียงตัวสวยงามคมชัด",
            // (ข้อมูล 468-490 เหมือนเดิม)
            // ...
            491: "ถ่ายเมื่อ 23/10/2025 12:25 น. - มุมท็อปซูมใกล้ดอกยิมโนสีชมพูหวาน บานรับแดดโชว์เกสรละเอียดกลางดอก",
            492: "ถ่ายเมื่อ 23/10/2025 12:25 น. - อีกมุมสวยๆ จากด้านบนของดอกยิมโนสีชมพูหวาน เกสรชัดเจนสมบูรณ์",
            493: "ถ่ายเมื่อ 23/10/2025 12:25 น. - ซูมความงามของเกสรและกลีบดอกยิมโนสีชมพูอ่อนหวาน",
            494: "ถ่ายเมื่อ 23/10/2025 12:26 น. - ยิมโนต้นทรงกลม ออกดอกสีชมพูบานเดี่ยวบนยอดพูสวยงาม",
            495: "ถ่ายเมื่อ 23/10/2025 12:27 น. - มุมเฉียงยิมโนดอกชมพู ในกระถางเซรามิกน่ารัก",
            496: "ถ่ายเมื่อ 27/10/2025 09:53 น. - ช่อดอกไม้สีม่วงอ่อนสวยแปลกตา บนลำต้นและใบสีเขียว (*สายพันธุ์รอตรวจสอบ*)",
            497: "ถ่ายเมื่อ 03/12/2025 13:30 น. - ยิมโนด่างสีสันจัดจ้าน ออกดอกสีขาวนวลบานพร้อมกัน 3 ดอกอลังการ",
            498: "ภาพคอลลาจรวมความงาม: ดอกยิมโนสีเหลืองอ่อน และกลุ่มโลบิเวียสีส้มพีช/ชมพูแดง บานสะพรั่ง",
            499: "ภาพคอลลาจรวมดอกสีสดใส: โลบิเวียสีส้มพีช และยิมโนดอกสีชมพูพราวหยดน้ำ สวยสดชื่น",
            500: "ภาพคอลลาจสุดอลังการ: รวมรูปแคคตัสออกดอกหลากหลายสายพันธุ์ ทั้งยิมโน โลบิเวีย และอื่นๆ สวยงามเต็มพื้นที่"
        };

        // --- ส่วนการทำงาน (Logic Zone) ---
        const galleryGrid = document.getElementById('galleryGrid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxDesc = document.getElementById('lightboxDesc');

        // ฟังก์ชันสร้างรายการแกลเลอรี
        function createGalleryItem(i) {
            // ไม่มีบรรทัด if (i === 466) แล้ว เพราะตอนนี้เราแสดงรูป 466 (แคคตัสใหม่)

            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            // สร้างลิงก์ภาพ
            const img = document.createElement('img');
            img.src = `gallery/cactus (${i}).jpg`; // ที่อยู่ไฟล์รูปภาพ
            img.alt = `Cactus ${i}`;
            // เมื่อโหลดภาพไม่สำเร็จ ให้ซ่อนกรอบรูปนั้น
            img.onerror = function() {
                item.style.display = 'none'; 
            };

            // ส่วนข้อมูล
            const info = document.createElement('div');
            info.className = 'gallery-info';
            const speciesName = cactusNames[i] || 'Gymnocalycium (ยิมโน)'; // ชื่อสายพันธุ์ (ถ้าไม่มีใช้ค่าเริ่มต้น)
            info.innerHTML = `
                <span class="img-num">รูปที่ ${i}</span>
                <span class="species">${speciesName}</span>
            `;

            // ประกอบชิ้นส่วน
            item.appendChild(img);
            item.appendChild(info);
            
            // เพิ่มเหตุการณ์คลิกเพื่อเปิด Lightbox
            item.addEventListener('click', () => openLightbox(i, speciesName, cactusDesc[i]));

            // เพิ่มเข้า Grid
            galleryGrid.appendChild(item);
        }

        // วนลูปสร้างรูปภาพตั้งแต่ 1 ถึง 500 (รวมรูป 466 ด้วย)
        for (let i = 1; i <= 500; i++) {
            createGalleryItem(i);
        }

        // --- Lightbox Functions ---
        // เปิด Lightbox
        function openLightbox(imgNum, species, desc) {
            lightboxImg.src = `gallery/cactus (${imgNum}).jpg`;
            // ใช้ชื่อสายพันธุ์และคำบรรยายที่ได้มา
            const descriptionText = desc || `ภาพแคคตัสรูปที่ ${imgNum}`;
            lightboxDesc.innerHTML = `
                <span class="img-num-modal">รูปที่ ${imgNum}</span><br>
                <strong>${species}</strong>
                <p>${descriptionText}</p>
            `;
            lightbox.classList.add('open');
            // ป้องกันการเลื่อนหน้าเว็บด้านหลัง
            document.body.style.overflow = 'hidden'; 
        }

        // ปิด Lightbox
        function closeLightbox() {
            lightbox.classList.remove('open');
            // คืนค่าการเลื่อนหน้าเว็บ
            document.body.style.overflow = ''; 
        }

        // ปิด Lightbox เมื่อคลิกพื้นที่ว่าง
        lightbox.addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // ปิด Lightbox เมื่อกดปุ่ม Esc
        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape" && lightbox.classList.contains('open')) {
                closeLightbox();
            }
        });

    </script>
</body>
</html>

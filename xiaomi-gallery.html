      const startIdx = 1;
        
        // 🚀 ระบบจะค้นหาตัวเลขรหัสรูปภาพที่สูงที่สุดใน cactusNames ให้โดยอัตโนมัติ
        const endIdx = Math.max(...Object.keys(cactusNames).map(Number)); 
        
        // 🚀 ระบบจะอัปเดตข้อความบนแท็บเบราว์เซอร์ และหัวข้อหน้าเว็บให้อัตโนมัติทันที
        document.title = `Xiaomi 17 Ultra Gallery (รูปที่ ${startIdx} - ${endIdx})`;
        document.getElementById('gallery-title').textContent = `Xiaomi 17 Ultra - Cactus Gallery (รูปที่ ${startIdx} - ${endIdx})`;
        
        const container = document.getElementById('gallery');
        let current = startIdx;

        for (let i = startIdx; i <= endIdx; i++) {
            const div = document.createElement('div');
            div.className = 'card';
            
            const displayName = cactusNames[i] ? `รูปที่ ${i} : ${cactusNames[i]}` : `รูปที่ ${i}`;
            
            div.innerHTML = `<img src="xiaomi/xm(${i}).jpg" loading="lazy" onerror="this.src='https://via.placeholder.com/220x200?text=Cactus+${i}'"><div style="margin-top: 8px; font-weight: bold; font-size: 13px;">${displayName}</div>`;
            div.onclick = () => { current = i; show(i); };
            container.appendChild(div);
        }

        function show(i) {
            document.getElementById('lightbox-img').src = `xiaomi/xm(${i}).jpg`;
            
            const name = cactusNames[i] ? `รูปที่ ${i} : ${cactusNames[i]}` : `รูปที่ ${i}`;
            const desc = cactusDesc[i] ? `<div class="desc-text">${cactusDesc[i]}</div>` : '';
            
            document.getElementById('lightbox-caption').innerHTML = `<strong>${name}</strong>${desc}`;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function changeImage(dir) {
            current += dir;
            if (current < startIdx) current = endIdx;
            if (current > endIdx) current = startIdx;
            show(current);
        }

        document.addEventListener('keydown', (e) => {
            if(document.getElementById('lightbox').style.display === 'flex') {
                if(e.key === 'ArrowLeft') changeImage(-1);
                if(e.key === 'ArrowRight') changeImage(1);
                if(e.key === 'Escape') document.getElementById('lightbox').style.display = 'none';
            }
        });
    </script>

        .right-btn { right: 20px; }
        .close-btn { position: absolute; top: 20px; right: 40px; color: white; font-size: 40px; cursor: pointer; }

    </style>

            90: "กลุ่มดอกยิมโนสีชมพูอ่อน ชุ่มฉ่ำไปด้วยหยดน้ำ",
            91: "ดอกคู่ยิมโนสีขาว ขอบชมพูอ่อน ชุ่มฉ่ำหลังฝน",
            92: "การจับคู่สีที่ลงตัว ระหว่างดอกสีชมพูและสีเหลืองอ่อน",
            93: "ยิมโนด่างลำต้นสวยงาม ตัดกับดอกสีเหลืองอ่อน",
            94: "ช่อดอกยิมโนสีขาว เรียงซ้อนกันอย่างมีระเบียบ",
            95: "กลุ่มดอกยิมโนสีชมพูอ่อน ชุ่มฉ่ำ สวยงามมาก",
            96: "แมมมิลลาเรียดอกสีบานเย็นสดใส ตัดกับหนามสีเข้ม",
            97: "กลุ่มดอกแมมมิลลาเรียสีบานเย็น เรียงตัวสวยงาม",
            98: "ดอกสีบานเย็นสดใส สร้างสีสันให้สวน",
            99: "ความสวยงามของแมมมิลลาเรียทรงกระบอกยามออกดอก",
            100: "ช่อดอกแมมมิลลาเรียสีบานเย็น บานสะพรั่งเต็มต้น"
        };

        const total = 397; 
        const container = document.getElementById('gallery');
        let current = 1;

        for (let i = 1; i <= total; i++) {
            const div = document.createElement('div');
            div.className = 'card';
            
            // 💡 แก้ไขตรงนี้: ให้แสดง "รูปที่ X : ชื่อแคคตัส"
            const displayName = cactusNames[i] ? `รูปที่ ${i} : ${cactusNames[i]}` : `รูปที่ ${i}`;
            
            div.innerHTML = `<img src="xiaomi/xm(${i}).jpg"><div style="margin-top: 8px; font-weight: bold;">${displayName}</div>`;
            div.onclick = () => { current = i; show(i); };
            container.appendChild(div);
        }

        function show(i) {
            document.getElementById('lightbox-img').src = `xiaomi/xm(${i}).jpg`;
            
            // 💡 แก้ไขตรงนี้: ให้หน้าจอขยายแสดง "รูปที่ X : ชื่อแคคตัส" ด้วย
            const name = cactusNames[i] ? `รูปที่ ${i} : ${cactusNames[i]}` : `รูปที่ ${i}`;
            const desc = cactusDesc[i] ? `<div class="desc-text">${cactusDesc[i]}</div>` : '';
            
            document.getElementById('lightbox-caption').innerHTML = `<strong>${name}</strong>${desc}`;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function changeImage(dir) {
            current += dir;
            if (current < 1) current = total;
            if (current > total) current = 1;
            show(current);
        }

        document.addEventListener('keydown', (e) => {
            if(document.getElementById('lightbox').style.display === 'flex') {
                if(e.key === 'ArrowLeft') changeImage(-1);
                if(e.key === 'ArrowRight') changeImage(1);
                if(e.key === 'Escape') document.getElementById('lightbox').style.display = 'none';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiaomi 17 Ultra Gallery</title>
    <style>
        body { font-family: sans-serif; background-color: #fcfbf7; margin: 0; padding: 20px; color: #333; }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #fff8e1; padding: 10px; border-radius: 10px; cursor: pointer; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        
        /* สไตล์สำหรับชื่อพันธุ์และคำว่ารูปที่... */
        .name-text { color: #2e7d32; font-weight: bold; margin-top: 10px; font-size: 1.1rem; }
        .num-text { color: #666; font-size: 0.9rem; margin-top: 3px; }

        #lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; }
        #lightbox img { max-width: 90%; max-height: 70%; border: 5px solid white; }
        #lightbox-caption { color: white; text-align: center; margin-top: 15px; }
        .nav-btn { position: absolute; top: 50%; color: white; font-size: 50px; cursor: pointer; padding: 20px; user-select: none; }
        .left-btn { left: 20px; }
        .right-btn { right: 20px; }
        .close-btn { position: absolute; top: 20px; right: 40px; color: white; font-size: 40px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container" id="gallery"></div>
    <div id="lightbox">
        <span class="close-btn" onclick="document.getElementById('lightbox').style.display='none'">&times;</span>
        <span class="nav-btn left-btn" onclick="changeImage(-1)">&#10094;</span>
        <img id="lightbox-img" src="">
        <span class="nav-btn right-btn" onclick="changeImage(1)">&#10095;</span>
        <div id="lightbox-caption"></div>
    </div>

    <script>
        const total = 397; // จำนวนรูปรวม
        const container = document.getElementById('gallery');
        let current = 1;

        // 📝 สมุดทะเบียนชื่อแคคตัส
        // รูปไหนยังไม่มีชื่อ ก็แค่ปล่อยผ่านไปครับ ระบบจะโชว์แค่ "รูปที่..." ให้เอง
        const cactusNames = {
            1: "Gymnocalycium (ยิมโน)",
            2: "Astrophytum (แอสโตร)",
            8: "Echinopsis (อิชินอปซิส)",
            // สหายสามารถเพิ่มเลขรูป และชื่อลงมาได้เรื่อยๆ เลยครับ
        };

        for (let i = 1; i <= total; i++) {
            const div = document.createElement('div');
            div.className = 'card';
            
            // เช็คว่ารูปนี้ถูกตั้งชื่อไว้ในสมุดทะเบียนหรือเปล่า
            let nameHtml = '';
            if (cactusNames[i]) {
                nameHtml = `<div class="name-text">${cactusNames[i]}</div>`;
            }
            
            // ประกอบร่าง: รูปภาพ + ชื่อ(ถ้ามี) + คำว่า รูปที่... (มีเสมอ)
            div.innerHTML = `
                <img src="xiaomi/xm(${i}).jpg">
                ${nameHtml}
                <div class="num-text">รูปที่ ${i}</div>
            `;
            
            div.onclick = () => { current = i; show(i); };
            container.appendChild(div);
        }

        function show(i) {
            document.getElementById('lightbox-img').src = `xiaomi/xm(${i}).jpg`;
            
            // จัดการข้อความตอนขยายรูปใหญ่ (จอดำ)
            let captionHtml = '';
            if (cactusNames[i]) {
                captionHtml = `<div style="color: #81c784; font-weight: bold; font-size: 1.5rem;">${cactusNames[i]}</div>`;
            }
            captionHtml += `<div style="font-size: 1rem; color: #ccc; margin-top: 5px;">รูปที่ ${i}</div>`;
            
            document.getElementById('lightbox-caption').innerHTML = captionHtml;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function changeImage(dir) {
            current += dir;
            if (current < 1) current = total;
            if (current > total) current = 1;
            show(current);
        }

        document.addEventListener('keydown', (e) => {
            if(document.getElementById('lightbox').style.display === 'flex') {
                if(e.key === 'ArrowLeft') changeImage(-1);
                if(e.key === 'ArrowRight') changeImage(1);
                if(e.key === 'Escape') document.getElementById('lightbox').style.display = 'none';
            }
        });
    </script>
</body>
</html>

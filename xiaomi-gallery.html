<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xiaomi 17 Ultra Gallery</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #111111; /* พื้นหลังสีดำพรีเมียม */
        color: #ffffff;
        margin: 0;
        padding: 20px;
        text-align: center;
    }
    h1 { color: #ff6e00; margin-bottom: 5px; }
    p { color: #aaaaaa; margin-bottom: 30px; }
    .back-btn {
        display: inline-block;
        padding: 10px 20px;
        background: #333333;
        color: #ff6e00;
        text-decoration: none;
        border-radius: 20px;
        border: 1px solid #ff6e00;
        margin-bottom: 20px;
        font-weight: bold;
    }
    .back-btn:hover { background: #ff6e00; color: #111; }
    
    .gallery-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
        max-width: 1200px;
        margin: auto;
    }
    .gallery-item img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 12px;
        border: 2px solid #333;
        transition: transform 0.3s, border-color 0.3s;
    }
    .gallery-item img:hover {
        transform: scale(1.05);
        border-color: #ff6e00;
    }
</style>
</head>
<body>

    <a href="index.html" class="back-btn">← กลับหน้าหลัก</a>

    <h1>📸 SUTHEPW13 Cactus Gallery</h1>
    <p>by...Xiaomi 17 Ultra | สัมผัสความคมชัดระดับ Ultra</p>

    <div class="gallery-container">
        <!-- อนาคตสหายเอารูปจากกล้อง Xiaomi มาใส่ตรงนี้ได้เลยครับ เปลี่ยนแค่ชื่อไฟล์.jpg -->
        <div class="gallery-item"><img src="20260702_194152_2301.jpg" alt="Xiaomi Photo"></div>
        
    </div>

</body>
</html>

            199: "ถ่ายเมื่อ 2026.05.11 06:24 น. - ดอกส้มไฟคู่มุมด้านข้าง แสดงรายละเอียดก้านและโคนดอกที่แข็งแรง",
            200: "ถ่ายเมื่อ 2026.05.11 06:25 น. - ดอกส้มไฟผสมชมพูขนาดใหญ่บานเต็มที่ กลีบดอกซ้อนฟูสวยงามมาก"
        };

        const startIdx = 1;
        const endIdx = 200;
        const container = document.getElementById('gallery');
        let current = startIdx;

        for (let i = startIdx; i <= endIdx; i++) {
            const div = document.createElement('div');
            div.className = 'card';
            
            const displayName = cactusNames[i] ? `รูปที่ ${i} : ${cactusNames[i]}` : `รูปที่ ${i}`;
            
            div.innerHTML = `<img src="xm(${i}).jpg" onerror="this.src='https://via.placeholder.com/220x200?text=Cactus+${i}'"><div style="margin-top: 8px; font-weight: bold; font-size: 13px;">${displayName}</div>`;
            div.onclick = () => { current = i; show(i); };
            container.appendChild(div);
        }

        function show(i) {
            document.getElementById('lightbox-img').src = `xm(${i}).jpg`;
            
            const name = cactusNames[i] ? `รูปที่ ${i} : ${cactusNames[i]}` : `รูปที่ ${i}`;
            const desc = cactusDesc[i] ? `<div class="desc-text">${cactusDesc[i]}</div>` : '';
            
            document.getElementById('lightbox-caption').innerHTML = `<strong>${name}</strong>${desc}`;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function changeImage(dir) {
            current += dir;
            if (current < startIdx) current = endIdx;
            if (current > endIdx) current = startIdx;
            show(current);
        }

        document.addEventListener('keydown', (e) => {
            if(document.getElementById('lightbox').style.display === 'flex') {
                if(e.key === 'ArrowLeft') changeImage(-1);
                if(e.key === 'ArrowRight') changeImage(1);
                if(e.key === 'Escape') document.getElementById('lightbox').style.display = 'none';
            }
        });
    </script>
</body>
</html>

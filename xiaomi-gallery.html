        .card { background: #fff8e1; padding: 10px; border-radius: 10px; cursor: pointer; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: transform 0.2s; }

        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }

        #lightbox img { max-width: 90%; max-height: 70vh; border: 5px solid white; object-fit: contain; border-radius: 6px; }
        #lightbox-caption { color: white; font-size: 1.2rem; margin-top: 15px; text-align: center; line-height: 1.5; padding: 0 20px; }
        .nav-btn { position: absolute; top: 50%; color: white; font-size: 50px; cursor: pointer; padding: 20px; user-select: none; transform: translateY(-50%); }
        .left-btn { left: 20px; }
        .right-btn { right: 20px; }
        .close-btn { position: absolute; top: 20px; right: 40px; color: white; font-size: 40px; cursor: pointer; }
        .desc-text { font-size: 1rem; color: #dddddd; margin-top: 5px; }
    </style>

        const startIdx = 1;
        const endIdx = 250;
        const container = document.getElementById('gallery');
        let current = startIdx;

        for (let i = startIdx; i <= endIdx; i++) {
            const div = document.createElement('div');
            div.className = 'card';
            
            const displayName = cactusNames[i] ? `รูปที่ ${i} : ${cactusNames[i]}` : `รูปที่ ${i}`;
            
            div.innerHTML = `<img src="xiaomi/xm(${i}).jpg" onerror="this.src='https://via.placeholder.com/220x200?text=Cactus+${i}'"><div style="margin-top: 8px; font-weight: bold; font-size: 13px;">${displayName}</div>`;
            div.onclick = () => { current = i; show(i); };
            container.appendChild(div);
        }

        function show(i) {
            document.getElementById('lightbox-img').src = `xiaomi/xm(${i}).jpg`;
            
            const name = cactusNames[i] ? `รูปที่ ${i} : ${cactusNames[i]}` : `รูปที่ ${i}`;
            const desc = cactusDesc[i] ? `<div class="desc-text">${cactusDesc[i]}</div>` : '';
            
            document.getElementById('lightbox-caption').innerHTML = `<strong>${name}</strong>${desc}`;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function changeImage(dir) {
            current += dir;
            if (current < startIdx) current = endIdx;
            if (current > endIdx) current = startIdx;
            show(current);
        }

        document.addEventListener('keydown', (e) => {
            if(document.getElementById('lightbox').style.display === 'flex') {
                if(e.key === 'ArrowLeft') changeImage(-1);
                if(e.key === 'ArrowRight') changeImage(1);
                if(e.key === 'Escape') document.getElementById('lightbox').style.display = 'none';
            }
        });
    </script>
